<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Editar tarefa</title><style>body{font-family:Arial;max-width:650px;margin:50px auto}input,textarea,select,button{display:block;margin:12px 0;padding:12px;width:95%}button{background:#1769d1;color:white;border:0}</style></head><body><h1>Editar tarefa</h1><form method="post"><input name="title" value="{{task.title}}" maxlength="120" required><textarea name="description" maxlength="1000">{{task.description}}</textarea><select name="priority">{% for p in priorities %}<option {% if task.priority==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select><select name="status">{% for s in statuses %}<option {% if task.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Salvar alterações</button></form><a href="/">Voltar</a></body></html>
