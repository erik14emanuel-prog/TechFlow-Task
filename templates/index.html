<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TechFlow Tasks</title><style>body{font-family:Arial,sans-serif;background:#f3f6fb;color:#17243b;max-width:950px;margin:35px auto;padding:0 18px}header,section,article{background:white;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #dce3ed}input,textarea,select,button{padding:10px;margin:5px;border:1px solid #cbd5e1;border-radius:6px}button{background:#1769d1;color:white;cursor:pointer}.danger{background:#bd2c36}article{border-left:5px solid #1769d1}a{color:#1769d1}</style></head><body><header><h1>TechFlow Tasks</h1><p>Gestão ágil de tarefas para equipes de logística</p></header><section><h2>Nova tarefa</h2><form action="{{ url_for('create_task') }}" method="post"><input name="title" maxlength="120" placeholder="Título" required><input name="description" maxlength="1000" placeholder="Descrição"><select name="priority">{% for p in priorities %}<option>{{p}}</option>{% endfor %}</select><select name="status">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select><button>Criar</button></form></section><section><form method="get"><label>Filtrar status <select name="status"><option value="">Todos</option>{% for s in statuses %}<option {% if selected==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><button>Filtrar</button></form></section><h2>Tarefas ({{tasks|length}})</h2>{% for task in tasks %}<article><h3>{{task.title}}</h3><p>{{task.description}}</p><p><strong>{{task.priority}}</strong> · {{task.status}}</p><a href="{{url_for('edit_form',task_id=task.id)}}">Editar</a><form style="display:inline" method="post" action="{{url_for('delete_task',task_id=task.id)}}"><button class="danger" onclick="return confirm('Excluir esta tarefa?')">Excluir</button></form></article>{% else %}<p>Nenhuma tarefa cadastrada.</p>{% endfor %}</body></html>
